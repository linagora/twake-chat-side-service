name: Check

on:
  workflow_call:
    inputs:
      runner:
        description: The self-hosted runners for main and the tags; GitHub's for the pull requests, which forks open too
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      # Moderate advisories pass until @sentry/node depends on glob 14.0.2 or later
      # (getsentry/sentry-javascript#25981): back to a plain npm audit then
      - run: npm audit --audit-level=high
      - name: Start PostgreSQL for the tests
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres' --health-interval 2s postgres:18
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
      - run: npm run check
